<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">A prize being tossed inside the claw machine</title>
  <desc id="desc">A toy arcs through the glass playfield after the claw throws it.</desc>
  <defs><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#f9fdff"/><stop offset="1" stop-color="#e7f5fa"/></linearGradient></defs>
  <rect width="800" height="600" fill="#fff8ed"/><rect x="35" y="24" width="730" height="552" rx="14" fill="#d3edf3"/><rect x="49" y="38" width="702" height="524" rx="10" fill="#fff8ed"/><rect x="72" y="50" width="656" height="60" rx="8" fill="#b2c8e4"/>
  <text x="400" y="82" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Trebuchet MS,sans-serif" font-size="25" font-weight="bold">definitely not rigged claw machine</text>
  <rect x="83" y="125" width="634" height="375" rx="5" fill="url(#glass)" stroke="#94c0e9" stroke-width="4"/>
  <g opacity=".65" fill="none" stroke="#b2c8e4" stroke-width="4" stroke-linecap="round"><path d="M238 288q-32 12-48 38"/><path d="M251 306q-19 9-28 23"/><path d="M526 365q28 6 44 22"/></g>

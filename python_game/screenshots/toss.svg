  <g fill="white" font-family="Segoe UI Symbol,sans-serif" font-size="24" text-anchor="middle" dominant-baseline="central"><text x="166" y="449">★</text><text x="227" y="458">★</text><text x="294" y="450">★</text><text x="357" y="459">★</text><text x="426" y="450">★</text><text x="491" y="459">★</text><text x="555" y="450">★</text><text x="606" y="458">★</text></g>
  <path d="M92 497h616v14H92z" fill="#94c0e9"/><rect x="630" y="479" width="75" height="56" rx="3" fill="#b8d5dd" stroke="#94c0e9" stroke-width="3"/><text x="668" y="521" text-anchor="middle" fill="#55465e" font-family="Trebuchet MS,sans-serif" font-size="10" font-weight="bold">PRIZE</text>
  <path d="M510 88v84" stroke="#55465e" stroke-width="3"/><circle cx="510" cy="178" r="11" fill="#75b0f4" stroke="#55465e" stroke-width="2"/><g fill="none" stroke="#55465e" stroke-width="4" stroke-linecap="round"><path d="M510 188l-18 22M510 188l18 22"/><path d="M486 200q24 29 48 0"/></g>
  <circle cx="274" cy="270" r="28" fill="#7ab0e2" stroke="white" stroke-width="3"/><text x="274" y="270" text-anchor="middle" dominant-baseline="central" fill="white" font-family="Segoe UI Symbol,sans-serif" font-size="27">★</text>
  <rect x="83" y="525" width="634" height="26" rx="4" fill="#bddae8"/><text x="98" y="542" fill="#55465e" font-family="Trebuchet MS,sans-serif" font-size="11" font-weight="bold">YEET! That toy had other plans!</text><text x="702" y="542" text-anchor="end" fill="#55465e" font-family="Trebuchet MS,sans-serif" font-size="12" font-weight="bold">SCORE  0</text><text x="400" y="570" text-anchor="middle" fill="#55465e" font-family="Trebuchet MS,sans-serif" font-size="10" font-weight="bold">LEFT / RIGHT: MOVE     SPACE: GRAB     R: NEW GAME</text>

{% extends "base.html" %}
{% block content %}
<section class="feed-column hashtag-feed">
    <div class="section-head">
        <h1>#{{ tag }}</h1>
        <a href="{{ url_for('home') }}">Back to feed</a>
    </div>
    {% for post in posts %}
    {% include "_post_card.html" %}
    {% else %}
    <div class="empty-state">No posts with #{{ tag }} yet.</div>
    {% endfor %}
</section>
{% endblock %}
